name: Build Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare production signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PAKHSH_MAHDI_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PAKHSH_MAHDI_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PAKHSH_MAHDI_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAKHSH_MAHDI_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Missing PAKHSH_MAHDI_ANDROID_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing PAKHSH_MAHDI_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing PAKHSH_MAHDI_ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing PAKHSH_MAHDI_ANDROID_KEY_PASSWORD"; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/pakhsh-mahdi-release.jks"
          printf "%s" "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "PM_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "PM_ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PM_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PM_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android             :app:assemblePakhshMahdiRelease             :app:bundlePakhshMahdiRelease             :app:lintPakhshMahdiRelease             :app:testPakhshMahdiReleaseUnitTest             --stacktrace

      - name: Package signed release
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -type f -path '*/pakhshMahdi/release/*.apk' | head -n 1)"
          AAB="$(find android/app/build/outputs/bundle -type f -name '*.aab' | head -n 1)"
          test -f "$APK"
          test -f "$AAB"

          mkdir -p release
          cp "$APK" release/PakhshMahdi-1.0.0-release.apk
          cp "$AAB" release/PakhshMahdi-1.0.0-release.aab

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/PakhshMahdi-1.0.0-release.apk
          sha256sum release/PakhshMahdi-1.0.0-release.apk > release/PakhshMahdi-1.0.0-release.apk.sha256
          sha256sum release/PakhshMahdi-1.0.0-release.aab > release/PakhshMahdi-1.0.0-release.aab.sha256

      - name: Upload signed production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PakhshMahdi-Android-1.0.0-Signed-Release
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pakhsh-mahdi-release.jks"
