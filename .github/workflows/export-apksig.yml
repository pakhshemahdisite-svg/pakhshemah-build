name: Export APK Signing Tool

on:
  push:
    branches: [ "release/0.10.6-from-0.10.3" ]
    paths:
      - "ci/tools/apksig-8.9.0.jar"
      - ".github/workflows/export-apksig.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: apksig-8.9.0
          path: ci/tools/apksig-8.9.0.jar
          if-no-files-found: error
          retention-days: 1
