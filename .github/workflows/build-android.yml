name: Build Pakhsh Mahdi Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - "clients/pakhsh-mahdi/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: pakhsh-mahdi-android-public
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|platform-tools"
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android :app:assemblePakhshMahdiDebug --stacktrace
      - name: Run lint and unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android :app:lintPakhshMahdiDebug :app:testPakhshMahdiDebugUnitTest

      - name: Build release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android :app:assemblePakhshMahdiRelease :app:bundlePakhshMahdiRelease --stacktrace
      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p release
          cp "$APK" release/PakhshMahdi-latest-dev.apk
          sha256sum release/PakhshMahdi-latest-dev.apk > release/PakhshMahdi-latest-dev.apk.sha256
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/PakhshMahdi-latest-dev.apk
      - name: Emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 2048M
          script: |
            adb install -r release/PakhshMahdi-latest-dev.apk
            adb shell pm path com.pakhshmahdi.app
            adb shell am force-stop com.pakhshmahdi.app
            adb shell monkey -p com.pakhshmahdi.app -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.pakhshmahdi.app

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PakhshMahdi-Android-0.9.9-RC-Installable
          path: |
            release/PakhshMahdi-latest-dev.apk
            release/PakhshMahdi-latest-dev.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PakhshMahdi-Android-0.9.9-Release-Candidate
          path: |
            android/app/build/outputs/apk/pakhshMahdi/release/*.apk
            android/app/build/outputs/bundle/pakhshMahdiRelease/*.aab
          if-no-files-found: error
          retention-days: 30
