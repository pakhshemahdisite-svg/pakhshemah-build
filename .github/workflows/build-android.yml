name: Build Pakhsh Mahdi Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - "clients/pakhsh-mahdi/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android :app:assemblePakhshMahdiDebug --stacktrace
      - name: Run lint and unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android :app:lintPakhshMahdiDebug :app:testPakhshMahdiDebugUnitTest
      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p release
          cp "$APK" release/PakhshMahdi-latest-dev.apk
          sha256sum release/PakhshMahdi-latest-dev.apk > release/PakhshMahdi-latest-dev.apk.sha256
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/PakhshMahdi-latest-dev.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PakhshMahdi-Android-0.9.8-Installable
          path: |
            release/PakhshMahdi-latest-dev.apk
            release/PakhshMahdi-latest-dev.apk.sha256
          if-no-files-found: error
          retention-days: 30
