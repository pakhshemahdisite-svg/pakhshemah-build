name: Live API Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ "main", "release/0.10.7", "release/0.10.8", "release/0.10.9", "release/0.10.10" ]
    paths:
      - ".github/workflows/live-api-smoke.yml"

permissions:
  contents: read

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate live Pakhsh Mahdi APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request

          endpoints = {
              "health": "https://pakhshemahdi.com/wp-json/pm-app/v1/health",
              "home": "https://pakhshemahdi.com/wp-json/pm-app/v1/home",
              "categories": "https://pakhshemahdi.com/wp-json/pm-app/v1/categories",
              "products": "https://pakhshemahdi.com/wp-json/pm-app/v1/products?page=1&per_page=20",
              "store_cart": "https://pakhshemahdi.com/wp-json/wc/store/v1/cart",
          }

          payloads = {}
          for name, url in endpoints.items():
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "PakhshMahdi-CI/1.0",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{name}: HTTP {response.status}")
                  raw = response.read().decode("utf-8")
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError as exc:
                      raise RuntimeError(f"{name}: invalid JSON") from exc
                  payloads[name] = payload
                  print(f"{name}: OK")

          # Verify authentication routes exist without sending an OTP.
          for route in ("auth/request-otp", "auth/verify-otp"):
              req = urllib.request.Request(
                  f"https://pakhshemahdi.com/wp-json/pm-app/v1/{route}",
                  method="OPTIONS",
                  headers={
                      "User-Agent": "PakhshMahdi-CI/1.0",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{route}: OPTIONS HTTP {response.status}")
                  route_info = json.loads(response.read().decode("utf-8"))
              if not isinstance(route_info, dict) or "methods" not in route_info:
                  raise RuntimeError(f"{route}: invalid REST route schema")
              print(f"{route}: route OK")

          health = payloads["health"]
          if not isinstance(health, dict):
              raise RuntimeError("health: expected JSON object")

          home = payloads["home"]
          if not isinstance(home, dict):
              raise RuntimeError("home: expected JSON object")
          for key in ("categories", "latestProducts", "featuredProducts", "onSaleProducts"):
              if key not in home:
                  raise RuntimeError(f"home: missing key {key}")

          categories = payloads["categories"]
          if not isinstance(categories, dict) or not isinstance(categories.get("items"), list):
              raise RuntimeError("categories: expected items array")
          if not categories["items"]:
              raise RuntimeError("categories: catalog unexpectedly empty")

          products = payloads["products"]
          if not isinstance(products, dict) or not isinstance(products.get("items"), list):
              raise RuntimeError("products: expected items array")
          if "page" not in products or "totalPages" not in products:
              raise RuntimeError("products: pagination fields missing")
          if not products["items"]:
              raise RuntimeError("products: catalog unexpectedly empty")

          sample = products["items"][0]
          if not isinstance(sample, dict):
              raise RuntimeError("products: sample product is not an object")
          for key in ("id", "name", "price", "stockStatus"):
              if key not in sample:
                  raise RuntimeError(f"products: sample product missing {key}")
          if not isinstance(sample["id"], int) or sample["id"] <= 0:
              raise RuntimeError("products: invalid sample product id")
          if not str(sample["name"]).strip():
              raise RuntimeError("products: empty sample product name")

          store_cart = payloads["store_cart"]
          if not isinstance(store_cart, dict) or "items" not in store_cart or "totals" not in store_cart:
              raise RuntimeError("store_cart: invalid WooCommerce Store API cart payload")

          # Exercise a real transient WooCommerce Store API cart session without
          # creating an order or payment. Select a simple, purchasable in-stock item.
          candidate = next(
              (
                  item for item in products["items"]
                  if isinstance(item, dict)
                  and item.get("type") == "simple"
                  and item.get("purchasable") is True
                  and item.get("stockStatus") == "instock"
                  and isinstance(item.get("id"), int)
                  and item["id"] > 0
              ),
              None,
          )
          if candidate is None:
              raise RuntimeError("cart smoke: no simple purchasable in-stock product found")

          # Validate the live Persian WooCommerce shipping city source and the
          # PM App shipping quote endpoint. These calls calculate only; no order is created.
          city_form = urllib.parse.urlencode({
              "action": "mahdiy_load_cities",
              "state_id": "558",
              "type": "billing",
          }).encode("utf-8")
          city_req = urllib.request.Request(
              "https://pakhshemahdi.com/wp-admin/admin-ajax.php",
              data=city_form,
              method="POST",
              headers={
                  "User-Agent": "PakhshMahdi-CI/1.0",
                  "Content-Type": "application/x-www-form-urlencoded",
              },
          )
          with urllib.request.urlopen(city_req, timeout=30) as response:
              city_html = response.read().decode("utf-8", errors="replace")
          city_match = re.search(
              r"""<option\s+[^>]*value=['"](\d+)['"][^>]*>""",
              city_html,
              re.IGNORECASE,
          )
          if not city_match or city_match.group(1) == "0":
              all_ids = re.findall(
                  r"""<option\s+[^>]*value=['"](\d+)['"][^>]*>""",
                  city_html,
                  re.IGNORECASE,
              )
              city_id = next((value for value in all_ids if value != "0"), None)
          else:
              city_id = city_match.group(1)
          if not city_id:
              raise RuntimeError("shipping smoke: PWS city list did not return a valid city")
          print(f"pws_cities: OK (city {city_id})")

          quote_payload = json.dumps({
              "lines": [{"id": candidate["id"], "quantity": 6}],
              "state": "558",
              "city": city_id,
              "postcode": "1111111111",
          }).encode("utf-8")
          quote_req = urllib.request.Request(
              "https://pakhshemahdi.com/wp-json/pm-app/v1/shipping-quote",
              data=quote_payload,
              method="POST",
              headers={
                  "User-Agent": "PakhshMahdi-CI/1.0",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(quote_req, timeout=30) as response:
              quote = json.loads(response.read().decode("utf-8"))
          if not isinstance(quote, dict) or not str(quote.get("rateId", "")).strip():
              raise RuntimeError("shipping smoke: invalid shipping quote payload")
          if "price" not in quote or "totalWeight" not in quote:
              raise RuntimeError("shipping smoke: quote totals missing")
          print("shipping_quote: OK")

          cart_url = endpoints["store_cart"]
          cart_req = urllib.request.Request(
              cart_url,
              headers={
                  "User-Agent": "PakhshMahdi-CI/1.0",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(cart_req, timeout=30) as response:
              cart_token = response.headers.get("Cart-Token")
          if not cart_token:
              raise RuntimeError("cart smoke: Cart-Token header missing")

          add_payload = json.dumps(
              {"id": candidate["id"], "quantity": 6}
          ).encode("utf-8")
          add_req = urllib.request.Request(
              "https://pakhshemahdi.com/wp-json/wc/store/v1/cart/add-item",
              data=add_payload,
              method="POST",
              headers={
                  "User-Agent": "PakhshMahdi-CI/1.0",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "Cart-Token": cart_token,
              },
          )
          with urllib.request.urlopen(add_req, timeout=30) as response:
              added = json.loads(response.read().decode("utf-8"))
          if not isinstance(added, dict) or int(added.get("items_count", 0)) < 1:
              raise RuntimeError("cart smoke: add-item did not produce a valid cart")
          if not isinstance(added.get("totals"), dict):
              raise RuntimeError("cart smoke: cart totals missing after add-item")
          print(f"cart_add_item: OK (product {candidate['id']})")

          customer_payload = json.dumps({
              "billing_address": {
                  "first_name": "CI",
                  "last_name": "Smoke",
                  "company": "",
                  "address_1": "CI smoke test",
                  "address_2": "",
                  "city": city_id,
                  "state": "558",
                  "postcode": "1111111111",
                  "country": "IR",
                  "phone": "09000000000",
                  "email": "",
              },
              "shipping_address": {
                  "first_name": "CI",
                  "last_name": "Smoke",
                  "company": "",
                  "address_1": "CI smoke test",
                  "address_2": "",
                  "city": city_id,
                  "state": "558",
                  "postcode": "1111111111",
                  "country": "IR",
              },
          }).encode("utf-8")
          customer_req = urllib.request.Request(
              "https://pakhshemahdi.com/wp-json/wc/store/v1/cart/update-customer",
              data=customer_payload,
              method="POST",
              headers={
                  "User-Agent": "PakhshMahdi-CI/1.0",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "Cart-Token": cart_token,
              },
          )
          with urllib.request.urlopen(customer_req, timeout=30) as response:
              updated_cart = json.loads(response.read().decode("utf-8"))
          if not isinstance(updated_cart, dict) or int(updated_cart.get("items_count", 0)) < 1:
              raise RuntimeError("cart smoke: update-customer returned invalid cart")
          if "shipping_rates" not in updated_cart:
              raise RuntimeError("cart smoke: shipping_rates field missing after update-customer")
          print("cart_update_customer: OK")

          clear_req = urllib.request.Request(
              "https://pakhshemahdi.com/wp-json/wc/store/v1/cart/items",
              method="DELETE",
              headers={
                  "User-Agent": "PakhshMahdi-CI/1.0",
                  "Accept": "application/json",
                  "Cart-Token": cart_token,
              },
          )
          with urllib.request.urlopen(clear_req, timeout=30) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"cart smoke: clear failed HTTP {response.status}")
          print("cart_clear: OK")

          # Validate a real variable product. Some imported Woo variations on
          # this store are wildcard children (Store API returns attributes=[]).
          # Reconstruct the chosen attribute from the parent product and global
          # Woo attribute term slugs, then verify Woo accepts the exact payload.
          variable_parent = None
          parent_detail = None
          for page in range(1, 6):
              url = f"https://pakhshemahdi.com/wp-json/pm-app/v1/products?page={page}&per_page=50"
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "PakhshMahdi-CI/1.0", "Accept": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  page_payload = json.loads(response.read().decode("utf-8"))
              variable_parent = next(
                  (item for item in page_payload.get("items", []) if item.get("type") == "variable"),
                  None,
              )
              if variable_parent:
                  break

          if variable_parent is None:
              raise RuntimeError("variable cart smoke: no variable product found")

          parent_id = int(variable_parent["id"])
          detail_req = urllib.request.Request(
              f"https://pakhshemahdi.com/wp-json/pm-app/v1/products/{parent_id}",
              headers={"User-Agent": "PakhshMahdi-CI/1.0", "Accept": "application/json"},
          )
          with urllib.request.urlopen(detail_req, timeout=30) as response:
              parent_detail = json.loads(response.read().decode("utf-8"))

          parent_attributes = [
              item for item in parent_detail.get("attributes", [])
              if item.get("variation") and item.get("options")
          ]
          parent_variations = parent_detail.get("variations", [])
          if not parent_attributes or not parent_variations:
              raise RuntimeError(
                  "variable cart smoke: parent variation metadata missing "
                  + json.dumps({
                      "id": parent_id,
                      "attributes": parent_detail.get("attributes", []),
                      "variations": parent_variations,
                  }, ensure_ascii=False)
              )

          # This smoke product currently has one varying attribute (color).
          attribute = parent_attributes[0]
          display_value = str(attribute["options"][0])
          attribute_slug = str(attribute.get("slug", ""))
          attribute_name = str(attribute.get("name", attribute_slug))
          request_attribute = attribute_name
          request_value = display_value

          if attribute_slug.startswith("pa_"):
              attrs_req = urllib.request.Request(
                  "https://pakhshemahdi.com/wp-json/wc/store/v1/products/attributes",
                  headers={"User-Agent": "PakhshMahdi-CI/1.0", "Accept": "application/json"},
              )
              with urllib.request.urlopen(attrs_req, timeout=30) as response:
                  global_attributes = json.loads(response.read().decode("utf-8"))

              taxonomy = next(
                  (item for item in global_attributes if item.get("taxonomy") == attribute_slug),
                  None,
              )
              if taxonomy is None:
                  raise RuntimeError(f"variable cart smoke: taxonomy {attribute_slug} not found")

              terms_req = urllib.request.Request(
                  f"https://pakhshemahdi.com/wp-json/wc/store/v1/products/attributes/{taxonomy['id']}/terms?per_page=100",
                  headers={"User-Agent": "PakhshMahdi-CI/1.0", "Accept": "application/json"},
              )
              with urllib.request.urlopen(terms_req, timeout=30) as response:
                  terms = json.loads(response.read().decode("utf-8"))

              term = next(
                  (item for item in terms if str(item.get("name", "")).strip() == display_value.strip()),
                  None,
              )
              if term is None:
                  raise RuntimeError(
                      f"variable cart smoke: term for {attribute_name}={display_value} not found"
                  )
              request_attribute = attribute_slug
              request_value = str(term["slug"])

          selected_variation = parent_variations[0]
          selected_variation_id = int(selected_variation["id"])
          candidate_selection = [{
              "attribute": request_attribute,
              "value": request_value,
          }]

          variable_cart_req = urllib.request.Request(
              endpoints["store_cart"],
              headers={"User-Agent": "PakhshMahdi-CI/1.0", "Accept": "application/json"},
          )
          with urllib.request.urlopen(variable_cart_req, timeout=30) as response:
              variable_cart_token = response.headers.get("Cart-Token")
          if not variable_cart_token:
              raise RuntimeError("variable cart smoke: Cart-Token missing")

          variable_payload = json.dumps({
              "id": selected_variation_id,
              "quantity": 6,
              "variation": candidate_selection,
          }).encode("utf-8")
          variable_add_req = urllib.request.Request(
              "https://pakhshemahdi.com/wp-json/wc/store/v1/cart/add-item",
              data=variable_payload,
              method="POST",
              headers={
                  "User-Agent": "PakhshMahdi-CI/1.0",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "Cart-Token": variable_cart_token,
              },
          )
          with urllib.request.urlopen(variable_add_req, timeout=30) as response:
              variable_cart = json.loads(response.read().decode("utf-8"))

          if not isinstance(variable_cart, dict) or int(variable_cart.get("items_count", 0)) < 1:
              raise RuntimeError("variable cart smoke: add-item returned invalid cart")

          print(
              "variable_cart_add_item: OK "
              f"(parent {parent_id}, variation {selected_variation_id}, "
              f"{request_attribute}={request_value})"
          )

          variable_clear_req = urllib.request.Request(
              "https://pakhshemahdi.com/wp-json/wc/store/v1/cart/items",
              method="DELETE",
              headers={
                  "User-Agent": "PakhshMahdi-CI/1.0",
                  "Accept": "application/json",
                  "Cart-Token": variable_cart_token,
              },
          )
          with urllib.request.urlopen(variable_clear_req, timeout=30):
              pass

          print("Live API smoke test passed.")
          PY
