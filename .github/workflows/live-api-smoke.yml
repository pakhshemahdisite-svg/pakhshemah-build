name: Live API Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/live-api-smoke.yml"

permissions:
  contents: read

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate live Pakhsh Mahdi APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          endpoints = {
              "health": "https://pakhshemahdi.com/wp-json/pm-app/v1/health",
              "home": "https://pakhshemahdi.com/wp-json/pm-app/v1/home",
              "categories": "https://pakhshemahdi.com/wp-json/pm-app/v1/categories",
              "products": "https://pakhshemahdi.com/wp-json/pm-app/v1/products?page=1&per_page=20",
              "store_cart": "https://pakhshemahdi.com/wp-json/wc/store/v1/cart",
          }

          payloads = {}
          for name, url in endpoints.items():
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "PakhshMahdi-CI/1.0",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{name}: HTTP {response.status}")
                  raw = response.read().decode("utf-8")
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError as exc:
                      raise RuntimeError(f"{name}: invalid JSON") from exc
                  payloads[name] = payload
                  print(f"{name}: OK")

          health = payloads["health"]
          if not isinstance(health, dict):
              raise RuntimeError("health: expected JSON object")

          home = payloads["home"]
          if not isinstance(home, dict):
              raise RuntimeError("home: expected JSON object")
          for key in ("categories", "latestProducts", "featuredProducts", "onSaleProducts"):
              if key not in home:
                  raise RuntimeError(f"home: missing key {key}")

          categories = payloads["categories"]
          if not isinstance(categories, dict) or not isinstance(categories.get("items"), list):
              raise RuntimeError("categories: expected items array")
          if not categories["items"]:
              raise RuntimeError("categories: catalog unexpectedly empty")

          products = payloads["products"]
          if not isinstance(products, dict) or not isinstance(products.get("items"), list):
              raise RuntimeError("products: expected items array")
          if "page" not in products or "totalPages" not in products:
              raise RuntimeError("products: pagination fields missing")
          if not products["items"]:
              raise RuntimeError("products: catalog unexpectedly empty")

          sample = products["items"][0]
          if not isinstance(sample, dict):
              raise RuntimeError("products: sample product is not an object")
          for key in ("id", "name", "price", "stockStatus"):
              if key not in sample:
                  raise RuntimeError(f"products: sample product missing {key}")
          if not isinstance(sample["id"], int) or sample["id"] <= 0:
              raise RuntimeError("products: invalid sample product id")
          if not str(sample["name"]).strip():
              raise RuntimeError("products: empty sample product name")

          store_cart = payloads["store_cart"]
          if not isinstance(store_cart, dict) or "items" not in store_cart or "totals" not in store_cart:
              raise RuntimeError("store_cart: invalid WooCommerce Store API cart payload")

          # Exercise a real transient WooCommerce Store API cart session without
          # creating an order or payment. Select a simple, purchasable in-stock item.
          candidate = next(
              (
                  item for item in products["items"]
                  if isinstance(item, dict)
                  and item.get("type") == "simple"
                  and item.get("purchasable") is True
                  and item.get("stockStatus") == "instock"
                  and isinstance(item.get("id"), int)
                  and item["id"] > 0
              ),
              None,
          )
          if candidate is None:
              raise RuntimeError("cart smoke: no simple purchasable in-stock product found")

          cart_url = endpoints["store_cart"]
          cart_req = urllib.request.Request(
              cart_url,
              headers={
                  "User-Agent": "PakhshMahdi-CI/1.0",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(cart_req, timeout=30) as response:
              cart_token = response.headers.get("Cart-Token")
          if not cart_token:
              raise RuntimeError("cart smoke: Cart-Token header missing")

          add_payload = json.dumps(
              {"id": candidate["id"], "quantity": 1}
          ).encode("utf-8")
          add_req = urllib.request.Request(
              "https://pakhshemahdi.com/wp-json/wc/store/v1/cart/add-item",
              data=add_payload,
              method="POST",
              headers={
                  "User-Agent": "PakhshMahdi-CI/1.0",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "Cart-Token": cart_token,
              },
          )
          with urllib.request.urlopen(add_req, timeout=30) as response:
              added = json.loads(response.read().decode("utf-8"))
          if not isinstance(added, dict) or int(added.get("items_count", 0)) < 1:
              raise RuntimeError("cart smoke: add-item did not produce a valid cart")
          if not isinstance(added.get("totals"), dict):
              raise RuntimeError("cart smoke: cart totals missing after add-item")
          print(f"cart_add_item: OK (product {candidate['id']})")

          clear_req = urllib.request.Request(
              "https://pakhshemahdi.com/wp-json/wc/store/v1/cart/items",
              method="DELETE",
              headers={
                  "User-Agent": "PakhshMahdi-CI/1.0",
                  "Accept": "application/json",
                  "Cart-Token": cart_token,
              },
          )
          with urllib.request.urlopen(clear_req, timeout=30) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"cart smoke: clear failed HTTP {response.status}")
          print("cart_clear: OK")

          print("Live API smoke test passed.")
          PY
